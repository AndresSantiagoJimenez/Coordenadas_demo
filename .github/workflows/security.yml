name: Seguridad - Escaneo de Dependencias y Secretos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Ejecución semanal para monitorear nuevas vulnerabilidades conocidas (CVEs)
    - cron: '0 6 * * 1'

jobs:
  dependency-audit:
    name: Auditoría de Vulnerabilidades de Dependencias (CVE)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Generar requirements para auditoría
        run: |
          uv export --format requirements-txt --no-dev -o requirements.txt

      - name: Auditar dependencias conocidas (pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          ignore-vulns: ""
