[project]
name = "geodataiq-colombia"
version = "1.0.0"
description = "Enterprise Geospatial Feature Store & Spatial Routing Engine for Colombia DANE and Multi-Source Data"
readme = "README.md"
authors = [
    { name = "Andres Santiago Jimenez" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "dbfread>=2.0.7",
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "geopandas>=0.13.2",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.5",
    "nbformat>=5.10.0",
    "numpy>=1.24.4",
    "openpyxl>=3.1.5",
    "pandas>=2.0.3",
    "plotly>=7.1.0",
    "pyarrow>=17.0.0",
    "pylint>=4.0.7",
    "pyogrio>=0.9.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.9",
    "scipy>=1.11.0",
    "shapely>=2.0.0",
    "streamlit>=1.66.0",
    "streamlit-folium>=0.27.4",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["test/*", ".venv/*"]

[tool.bandit]
exclude_dirs = [".venv", "test"]
skips = ["B101"]
